name: CI
on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Corepack goes first so setup-node's yarn cache lookup runs the version
      # pinned in package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install Node.js dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn typecheck

      # Build before the tests: the build-artifact suite in
      # __tests__/integration/end-to-end.test.tsx only runs when build/ exists.
      - name: Build (verify .d.ts emission)
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Smoke-test built artifact
        run: node ./__tests__/integration/smoke.cjs

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      # Replays the browser scenarios with real Chromium input and fails if any
      # trace differs from its jsdom golden file.
      - name: Browser cross-check of golden traces
        run: yarn golden:browser
